# Liquibase changelog — executed by the migration user (spring.liquibase.user), whose
# sessions act as the owner role, so every object created here is owned by it.
# Contains SCHEMA OBJECTS ONLY: roles and access permissions are provisioned with the
# database itself, including default privileges that auto-grant everything the owner
# creates to the rw/ro groups — see db/init/01-roles.sql for the expected layout.
databaseChangeLog:
  - changeSet:
      id: 001-create-greeting
      author: reference-app
      changes:
        - createTable:
            tableName: greeting
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message
                  type: text
                  constraints:
                    nullable: false
