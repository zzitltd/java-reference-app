# Azure provider profile: activates the Blob-Storage-backed ObjectStorage adapter and
# the Spring Cloud Azure autoconfiguration. Account/credentials come from the usual
# Azure chain (managed identity, env vars, ...); for a workstation + emulator use
# `local-azure`.
cloud:
  provider: azure
spring:
  autoconfigure:
    # Base list minus the Azure autoconfigurations (see application.yaml).
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.CredentialsProviderAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.RegionProviderAutoConfiguration
  cloud:
    azure:
      storage:
        blob:
          enabled: true
